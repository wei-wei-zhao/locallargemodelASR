<!DOCTYPE html>

<html>
    <title>识别文件路径</title>
<body>
    <button id="recordBtn">按住录音</button>
    <div id="result"></div>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const resultDiv = document.getElementById('result');
        let list = []
        // 1. 获取麦克风权限
        recordBtn.onmousedown = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            let chunks = [];

            // 2. 开始录音
            mediaRecorder.start();
            resultDiv.textContent = "录音中...";

            // 3. 停止录音并上传
            recordBtn.onmouseup = () => {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                resultDiv.textContent = "识别中...";
            };

            // 4. 处理录音数据
            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', blob, 'recording.webm');

                // 5. 发送到后端识别
                const response = await fetch('http://localhost:3000/uploadAudio', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                list.push(data.text)
                texts = [];
                
                list.forEach(item=>{
                    if(item.trim()===''){
                        return
                    }
                    let textContent = document.createElement('div');
                    textContent.innerText = item;
                    texts.unshift(textContent);
                })
                // resultDiv.textContent = `识别结果：${texts}`;
                if(texts.length){
                    resultDiv.innerHTML = texts.map(item => item.outerHTML).join('');
                }else{
                    resultDiv.textContent = '未识别到有效内容，请重试';
                }
                chunks = [];
            };
        };
    </script>
</body>
<style>
  #recordBtn {
    width: 200px;
    height: 100px;
    font-size: 30px;
  }
</style>
</html>
